---
# Workload tasks

- name: Log cluster provisioning success
  ansible.builtin.debug:
    msg: |
      TALM event received at {{ ansible_date_time.iso8601 }}:
      Cluster {{ inventory_hostname }} managed by {{ leafHubName }} hub SUCCEEDED.
      Cluster is ready for workloads.

- name: "Create ztp-ansible=running label for cluster {{ inventory_hostname }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: patched
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ inventory_hostname }}"
    definition:
      metadata:
        labels:
          ztp-ansible: "running"

- name: Get cluster kubeconfig secret
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Secret
    name: "{{ inventory_hostname }}-admin-kubeconfig"
    namespace: "{{ inventory_hostname }}"
  register: kubeconfig_secret_result

- name: Validate kubeconfig secret exists
  ansible.builtin.fail:
    msg: "Kubeconfig secret for cluster {{ inventory_hostname }} not found or missing 'kubeconfig' key"
  when:
    - kubeconfig_secret_result.resources | default([]) | length == 0 or
      not (kubeconfig_secret_result.resources[0].data | default({})).kubeconfig is defined

- name: Extract kubeconfig content from secret
  ansible.builtin.set_fact:
    extracted_kubeconfig: "{{ kubeconfig_secret_result.resources[0].data.kubeconfig | b64decode }}"
  no_log: true
  when:
    - kubeconfig_secret_result.resources | default([]) | length > 0
    - (kubeconfig_secret_result.resources[0].data | default({})).kubeconfig is defined

- name: Decode and save kubeconfig to file
  ansible.builtin.copy:
    content: "{{ extracted_kubeconfig }}"
    dest: "{{ kubeconfig_output_path }}"
    mode: '0600'
  no_log: true
  when: extracted_kubeconfig is defined

- name: Create namespace on cluster
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_output_path }}"
    state: present
    api_version: v1
    kind: Namespace
    name: "test-app"

- name: Pause for 1 minute
  ansible.builtin.wait_for:
    timeout: 60

- name: "Create ztp-ansible=completed label for cluster {{ inventory_hostname }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: patched
    api_version: cluster.open-cluster-management.io/v1
    kind: ManagedCluster
    name: "{{ inventory_hostname }}"
    definition:
      metadata:
        labels:
          ztp-ansible: "completed"
